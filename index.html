<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Text Humanizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f9f9f7; color: #1a1a1a; padding: 2rem 1rem; }
    .app { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 500; margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
    .mode-row { display: flex; gap: 8px; margin-bottom: 1.25rem; align-items: center; }
    .mode-label { font-size: 13px; color: #666; }
    .mode-btn { font-size: 12px; padding: 5px 14px; border-radius: 99px; border: 1px solid #ccc; background: transparent; cursor: pointer; }
    .mode-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: white; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #e0e0e0; font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea { width: 100%; height: 260px; border: none; outline: none; resize: none; padding: 14px; font-size: 14px; line-height: 1.7; font-family: inherit; background: transparent; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn-primary { padding: 10px 22px; font-size: 14px; font-weight: 500; border-radius: 8px; border: none; background: #1a1a1a; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 10px 22px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #ccc; background: transparent; cursor: pointer; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #888; margin-left: auto; }
    .copy-ok { font-size: 13px; color: green; opacity: 0; transition: opacity 0.3s; }
    .copy-ok.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <h1>AI Text Humanizer</h1>
    <p class="sub">Paste AI-generated text on the left and get a natural, human-sounding rewrite on the right.</p>

    <div class="mode-row">
      <span class="mode-label">Intensity:</span>
      <button class="mode-btn" data-mode="subtle" onclick="setMode('subtle')">Subtle</button>
      <button class="mode-btn active" data-mode="balanced" onclick="setMode('balanced')">Balanced</button>
      <button class="mode-btn" data-mode="aggressive" onclick="setMode('aggressive')">Aggressive</button>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          <span>Original text</span>
          <span id="input-count">0 chars</span>
        </div>
        <textarea id="input-text" placeholder="Paste your AI-generated text here…" oninput="document.getElementById('input-count').textContent = this.value.length + ' chars'"></textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>Humanized output</span>
          <span id="output-count">0 chars</span>
        </div>
        <textarea id="output-text" placeholder="Your humanized text will appear here…" readonly></textarea>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="humanize-btn" onclick="humanize()">
        <span id="btn-content">Humanize text</span>
      </button>
      <button class="btn-secondary" id="copy-btn" onclick="copyOutput()" disabled>Copy output</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <span class="copy-ok" id="copy-ok">Copied!</span>
      <span class="status" id="status">Ready</span>
    </div>
  </div>

  <script>
    const API_URL = "https://ai-humanizer-production-4270.up.railway.app";
    let mode = "balanced";

    function setMode(m) {
      mode = m;
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
    }

    async function humanize() {
      const input = document.getElementById("input-text").value.trim();
      if (!input) { setStatus("Please paste some text first."); return; }

      const btn = document.getElementById("humanize-btn");
      const btnContent = document.getElementById("btn-content");
      btn.disabled = true;
      btnContent.innerHTML = '<div class="spinner"></div> Humanizing…';
      setStatus("Processing…");
      document.getElementById("copy-btn").disabled = true;

      try {
        const res = await fetch(`${API_URL}/api/humanize`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input, mode })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Server error " + res.status);
        }

        const data = await res.json();
        document.getElementById("output-text").value = data.humanized;
        document.getElementById("output-count").textContent = data.humanized.length + " chars";
        document.getElementById("copy-btn").disabled = false;
        setStatus("Done!");
      } catch (err) {
        setStatus("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btnContent.textContent = "Humanize text";
      }
    }

    function copyOutput() {
      const text = document.getElementById("output-text").value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const el = document.getElementById("copy-ok");
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2000);
      });
    }

    function clearAll() {
      document.getElementById("input-text").value = "";
      document.getElementById("output-text").value = "";
      document.getElementById("input-count").textContent = "0 chars";
      document.getElementById("output-count").textContent = "0 chars";
      document.getElementById("copy-btn").disabled = true;
      setStatus("Ready");
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }
  </script>
</body>
</html>
